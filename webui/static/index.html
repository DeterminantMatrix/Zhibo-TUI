<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>直播监控工具</title>
<link rel="stylesheet" href="98.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="window app-window">
    <div class="title-bar" style="--pywebview-drag: drag;">
      <div class="title-bar-text" id="winTitle">直播监控工具 - [全部]</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize" id="btnMin"></button>
        <button aria-label="Maximize" id="btnMax"></button>
        <button aria-label="Close" id="btnClose"></button>
      </div>
    </div>

    <div class="menu-bar" role="menubar">
      <button class="menu-item" data-menu="file">文件(F)</button>
      <button class="menu-item" data-menu="view">查看(V)</button>
      <button class="menu-item" data-menu="action">操作(O)</button>
      <button class="menu-item" data-menu="tools">工具(T)</button>
      <button class="menu-item" data-menu="help">帮助(H)</button>
    </div>

    <div class="toolbar">
      <button id="btnRefresh">↻ 刷新 F5</button>
      <span class="toolbar-sep"></span>
      <input type="text" id="searchBox" class="search-box" placeholder="搜索主播、平台、标题…">
      <label class="filter-label">状态
        <select id="stateFilter">
          <option>全部</option>
          <option>在线</option>
          <option>离线</option>
          <option>异常</option>
        </select>
      </label>
    </div>

    <div class="tag-tabs" id="tagTabs"></div>

    <div class="table-wrap">
      <table id="streamTable">
        <thead>
          <tr>
            <th data-key="default" class="col-status">状态</th>
            <th data-key="tags">标签</th>
            <th data-key="name">主播</th>
            <th data-key="platform">平台</th>
            <th data-key="title">标题</th>
            <th data-key="quality">画质</th>
            <th data-key="last_check" class="col-narrow">检测</th>
            <th data-key="health" class="col-narrow">健康</th>
            <th data-key="plugin">插件</th>
            <th data-key="error">错误</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty-hint" id="emptyHint">没有匹配的关注项</div>
    </div>

    <div class="status-bar">
      <div class="status-bar-field" id="statusSummary">在线 0 / 总计 0</div>
      <div class="status-bar-field" id="statusPoll">等待监控核心…</div>
      <div class="status-bar-field status-bar-grow" id="statusInfo">P1</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
