<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ZHIBO · Web 界面原型</title>
<style>
  :root {
    --bg: #0b0f16; --bg2: #101724; --card: #131c2b; --line: #1e2a3d;
    --text: #e8eef7; --muted: #8a9bb0; --accent: #4cc9f0; --accent2: #7b6cf6;
    --green: #34d399; --gray: #5b6b80; --red: #f87171;
    --radius: 14px; --shadow: 0 8px 30px rgba(0,0,0,.35);
    font-size: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    background: radial-gradient(1200px 500px at 70% -10%, #16233a 0%, var(--bg) 55%);
    color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 18px 28px;
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(6px); position: sticky; top: 0; z-index: 5;
    background: rgba(11, 15, 22, .8);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
  .logo .ball {
    width: 26px; height: 26px; border-radius: 50%;
    background: conic-gradient(from 210deg, var(--accent), var(--accent2), var(--accent));
    box-shadow: 0 0 14px rgba(76, 201, 240, .55);
  }
  .logo small { color: var(--muted); font-weight: 400; }
  .search {
    flex: 1; max-width: 380px; display: flex; align-items: center; gap: 8px;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 14px; transition: border .2s, box-shadow .2s;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(76,201,240,.15); }
  .search input {
    flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 14px;
  }
  .search .icon { color: var(--muted); }
  .stats { margin-left: auto; display: flex; gap: 10px; }
  .stat {
    background: var(--bg2); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; text-align: center; min-width: 74px;
  }
  .stat b { display: block; font-size: 18px; }
  .stat span { color: var(--muted); font-size: 12px; }
  main { flex: 1; padding: 20px 28px; overflow: auto; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    border: 1px solid var(--line); background: var(--bg2); color: var(--muted);
    border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 13px;
    transition: all .18s;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.active {
    background: linear-gradient(135deg, rgba(76,201,240,.18), rgba(123,108,246,.18));
    border-color: var(--accent); color: var(--text);
  }
  .table-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow);
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; padding: 12px 16px; color: var(--muted); font-weight: 600;
    font-size: 12px; letter-spacing: .4px; border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,.02);
  }
  tbody tr { cursor: pointer; transition: background .15s; }
  tbody tr:hover { background: rgba(76,201,240,.06); }
  tbody tr.selected { background: rgba(76,201,240,.1); }
  tbody td { padding: 12px 16px; border-bottom: 1px solid rgba(30,42,61,.6); }
  tbody tr:last-child td { border-bottom: none; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  .dot.on { background: var(--green); box-shadow: 0 0 8px rgba(52,211,153,.8); }
  .dot.off { background: var(--gray); }
  .name { font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 12px;
    background: rgba(123,108,246,.14); color: #b7acff; border: 1px solid rgba(123,108,246,.25);
  }
  .quality { color: var(--accent); font-family: Consolas, monospace; font-size: 13px; }
  .toggle { width: 34px; height: 19px; border-radius: 999px; background: var(--gray); position: relative; transition: background .2s; }
  .toggle::after {
    content: ""; position: absolute; top: 2.5px; left: 3px; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; transition: left .2s;
  }
  .toggle.on { background: var(--green); }
  .toggle.on::after { left: 17px; }
  footer { padding: 12px 28px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  .drawer {
    position: fixed; top: 0; right: -380px; width: 360px; height: 100vh; z-index: 10;
    background: var(--bg2); border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(0,0,0,.45);
    padding: 24px; transition: right .25s ease; display: flex; flex-direction: column; gap: 14px;
  }
  .drawer.open { right: 0; }
  .drawer h2 { font-size: 18px; display: flex; align-items: center; }
  .drawer .close { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 18px; }
  .kv { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .kv span:first-child { color: var(--muted); }
  .btn {
    margin-top: auto; padding: 12px; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #06121c;
    font-weight: 700; font-size: 14px; transition: transform .15s, filter .15s;
  }
  .btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #223048; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="ball"></div>ZHIBO <small>· Web 界面原型</small></div>
  <div class="search"><span class="icon">⌕</span><input id="q" placeholder="搜索主播、平台…"/></div>
  <div class="stats">
    <div class="stat"><b id="stat-total">–</b><span>关注</span></div>
    <div class="stat"><b id="stat-platforms">–</b><span>平台</span></div>
    <div class="stat"><b id="stat-enabled">–</b><span>启用</span></div>
  </div>
</header>
<main>
  <div class="tags" id="tags"></div>
  <div class="table-card">
    <table>
      <thead><tr><th style="width:56px">状态</th><th>主播</th><th style="width:110px">平台</th><th>标签</th><th style="width:90px">画质</th><th style="width:70px">启用</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">没有匹配的关注项</div>
  </div>
</main>
<footer id="foot">正在加载数据…</footer>

<div class="drawer" id="drawer">
  <h2><span class="dot on" id="d-dot"></span><span id="d-name">–</span><span class="close" onclick="closeDrawer()">✕</span></h2>
  <div class="kv"><span>平台</span><span id="d-platform"></span></div>
  <div class="kv"><span>标签</span><span id="d-tags"></span></div>
  <div class="kv"><span>画质</span><span id="d-quality"></span></div>
  <div class="kv"><span>监控</span><span id="d-enabled"></span></div>
  <div class="kv"><span>地址</span><span id="d-url" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span></div>
  <button class="btn" id="d-open">在浏览器打开直播间</button>
</div>

<script>
let FOLLOWERS = [], currentTag = "全部", selected = -1;

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = FOLLOWERS.filter(f =>
    (currentTag === "全部" || f.tags.includes(currentTag)) &&
    (!q || f.name.toLowerCase().includes(q) || f.platform.toLowerCase().includes(q)));
  const tb = document.getElementById("rows");
  tb.innerHTML = "";
  list.forEach((f, i) => {
    const tr = document.createElement("tr");
    if (i === selected) tr.className = "selected";
    tr.innerHTML = `
      <td><span class="dot ${f.enabled ? "on" : "off"}"></span></td>
      <td><div class="name">${esc(f.name)}</div><div class="sub">${f.tags.join(" / ") || "未分类"}</div></td>
      <td><span class="badge">${esc(f.platform)}</span></td>
      <td class="quality">${esc(f.quality)}</td>
      <td>${f.enabled ? "✓" : "—"}</td>
      <td><div class="toggle ${f.enabled ? "on" : ""}"></div></td>`;
    tr.onclick = () => { selected = i; render(); openDrawer(f); };
    tb.appendChild(tr);
  });
  document.getElementById("empty").style.display = list.length ? "none" : "block";
}

function renderTags() {
  const tags = ["全部", ...new Set(FOLLOWERS.flatMap(f => f.tags))];
  const el = document.getElementById("tags");
  el.innerHTML = "";
  tags.forEach(t => {
    const c = document.createElement("div");
    c.className = "chip" + (t === currentTag ? " active" : "");
    c.textContent = t;
    c.onclick = () => { currentTag = t; selected = -1; render(); renderTags(); };
    el.appendChild(c);
  });
}

function openDrawer(f) {
  document.getElementById("d-name").textContent = f.name;
  document.getElementById("d-platform").textContent = f.platform;
  document.getElementById("d-tags").textContent = f.tags.join("、") || "未分类";
  document.getElementById("d-quality").textContent = f.quality;
  document.getElementById("d-enabled").textContent = f.enabled ? "已启用" : "已停用";
  document.getElementById("d-url").textContent = f.url;
  document.getElementById("d-open").onclick = async () => {
    if (window.pywebview) await pywebview.api.openWeb(f.url);
  };
  document.getElementById("d-dot").className = "dot " + (f.enabled ? "on" : "off");
  document.getElementById("drawer").classList.add("open");
}
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

document.getElementById("q").addEventListener("input", () => { selected = -1; render(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

async function boot() {
  try {
    if (!window.pywebview) throw new Error("no bridge");
    FOLLOWERS = await pywebview.api.getFollowers();
    const info = await pywebview.api.appInfo();
    document.getElementById("foot").textContent =
      `${info.engine} · 数据来自 followers.csv（只读原型，不含监控/播放）`;
  } catch (e) {
    document.getElementById("foot").textContent = "未检测到 pywebview 桥接，请用 proto/app.py 启动";
  }
  document.getElementById("stat-total").textContent = FOLLOWERS.length;
  document.getElementById("stat-platforms").textContent = new Set(FOLLOWERS.map(f => f.platform)).size;
  document.getElementById("stat-enabled").textContent = FOLLOWERS.filter(f => f.enabled).length;
  renderTags(); render();
}

let booted = false;
function bootOnce() { if (!booted) { booted = true; boot(); } }
// pywebview 注入桥接后派发 DOM 事件 pywebviewready；直接打开时立即尝试。
window.addEventListener('pywebviewready', bootOnce);
if (window.pywebview && window.pywebview.api) bootOnce();
</script>
</body>
</html>
